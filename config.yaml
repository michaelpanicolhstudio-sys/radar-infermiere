  - https://www.apspgrazioli.it/

# ---- Strutture conosciute che negli annunci non scrivono il comune: parola nel testo -> comune ----
zone_strutture:
  pitsch: Merano
  martinsbrunn: Merano
  ciasa de palsa: Val Badia
  eurac: Bolzano
  vinzenzhaus: Bolzano
  schloss moos: Vipiteno
  villa melitta: Bolzano
  brixsana: Bressanone
  solatrix: Rovereto
  villa bianca: Trento
  san camillo: Trento
  villa maria: Calliano
  casa di cura eremo: Arco

# ---- Lettura dei PDF allegati agli annunci (bandi, avvisi) ----
pdf:
  leggi: true
  massimo_per_annuncio: 2
  massimo_mb: 8
  massimo_pagine: 12

# ---- Email di primo contatto preparata dall'app (solo richiesta di informazioni) ----
# {titolo}, {datore} e {fonte} vengono sostituiti con i dati dell'annuncio.
email_contatto:
  oggetto: "Richiesta di informazioni – {titolo}"
  testo: |
    Buongiorno,

    ho letto il vostro annuncio «{titolo}» ({fonte}).
    Sono un infermiere iscritto all'OPI e sto valutando collaborazioni in libera professione in Trentino-Alto Adige.
    Vi chiedo gentilmente qualche informazione:
    - tipo di rapporto previsto (libera professione, collaborazione o assunzione);
    - impegno orario e turni;
    - compenso orario;
    - data di inizio.

    Grazie e cordiali saluti
    Michael Panico

# ---- Parole chiave (minuscole) ----
parole:
  # Almeno una deve comparire perché un annuncio sia considerato "per infermieri"
  infermiere: [infermier, krankenpfleg, pflegefach, pflegekraft, berufskrankenpfleg]
  # Link da aprire nelle pagine "elenco" quando la fonte non ha parole_link né tutti_i_link
  link: [infermier, krankenpfleg, pflege, libero profession, libero-profession,
         libera profession, incarichi lp, freiberuf, partita iva, p.iva,
         selezione, concorso, avviso, personale, sanitari]
  # Titoli da scartare se non nominano l'infermiere
  escludi_titolo: [coordinat, dirigente medico, dirigenti medici, assistente sanitario, operatore socio,
                   fisioterap, medicina turistica, cuoco, amministrativ, responsabile,
                   dirigenza, funzionario, in comando, direttore, educatore, ausiliari, medici specialisti]
  # Parole nel titolo che indicano un posto fuori dal Trentino-Alto Adige
  fuori_regione: [caorle, jesolo, veneto, verona, vicenza, belluno, lombardia, milano, brescia,
                  sicilia, sizilien, sardegna, innsbruck, österreich, austria, svizzera, schweiz, germania]

# ---- Comportamento in rete (educato) ----
rete:
  user_agent: "RadarInfermierePIVA/2.0 (ricerca personale di offerte di lavoro, una visita al giorno)"
  pausa_secondi: 3          # pausa tra due richieste allo stesso sito
  timeout_secondi: 25
  max_annunci_per_fonte: 25

# ---- Pulizia e memoria ----
giorni_prima_di_togliere: 30   # un annuncio sparito dalla fonte resta visibile per questi giorni
giorni_annuncio_datato: 120    # pubblicato da più giorni e senza scadenza valida = "datato" (fuori dalle attive)
giorni_rilettura_datati: 30    # gli annunci datati o scaduti vengono riletti solo ogni tot giorni
giorni_scaduti_visibili: 60    # dopo tot giorni dalla scadenza un annuncio esce dall'app
giorni_memoria_scarti: 14      # una pagina scartata (non per infermieri) non viene riaperta per tot giorni
