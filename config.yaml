# ============================================================
#  RADAR INFERMIERE P.IVA – configurazione
#  Puoi modificare questo file direttamente su GitHub (icona
#  della matita). Attenzione agli spazi a inizio riga: contano.
#  Ogni modifica salvata fa partire subito un giro di prova.
# ============================================================

profilo:
  casa: Mezzolombardo
  # no = non lo parlo | base = lo sto studiando | b2 = ho l'attestato
  tedesco: base
  # true = mostra anche concorsi e posti da dipendente (etichettati, punteggio basso)
  includi_dipendenti: true
  # Minuti d'auto massimi da casa. Scrivi un numero (es. 90) oppure null per nessun limite.
  minuti_massimi: null

# Indirizzo della web app (compare nelle email).
app_url: "https://radar-infermiere.pages.dev"

# ---- Pesi del punteggio (la somma dovrebbe fare 100) ----
pesi:
  contratto: 30
  compenso: 25
  distanza: 20
  turni: 15
  fonte: 10

# Punti tolti se l'annuncio cita tedesco/bilinguismo e tu hai "tedesco: no".
penalita_bilinguismo: 10

# ---- Feed RSS di Google Alerts (uno per riga) ----
feed_google_alerts:
  - "https://www.google.com/alerts/feeds/15325904899053201770/17973737193246577484"
  - "https://www.google.com/alerts/feeds/15325904899053201770/12962960680803267172"
  - "https://www.google.com/alerts/feeds/15325904899053201770/15453296471160879272"

# ---- Fonti ----
# tipo:
#   elenco = pagina con una lista di annunci (il Radar apre ogni annuncio)
#   pagina = singola pagina "lavora con noi" tenuta d'occhio
#   rss    = feed RSS/Atom
# affidabilita: ufficiale | struttura | aggregatore
# attiva: false per spegnere una fonte senza cancellarla
# Opzioni facoltative:
#   tutti_i_link: true      nella pagina ci sono solo annunci: li apre tutti
#   parole_link: [...]      apre solo i link il cui titolo contiene una di queste parole
#   altre_pagine: [...]     pagine successive dello stesso elenco
#   puo_essere_vuota: true  nessun avviso se l'elenco è vuoto
#   datore / zona           valori fissi, se la pagina è di una sola struttura
fonti:
  - nome: OPI Trento – annunci di lavoro
    tipo: elenco
    url: https://opi.tn.it/segreteria/annunci-di-lavoro/
    affidabilita: ufficiale
    tutti_i_link: true
    attiva: true

  - nome: OPI Bolzano – offerte di lavoro
    tipo: elenco
    url: https://www.opibz.it/?page_id=5109
    affidabilita: ufficiale
    tutti_i_link: true
    attiva: true

  - nome: UPIPA – concorsi delle APSP
    tipo: elenco
    url: https://www.upipa.tn.it/Bacheca/Concorsi
    altre_pagine:
      - https://www.upipa.tn.it/Bacheca/Concorsi/(offset)/10
    parole_link: [infermier, libero profession, libero-profession]
    affidabilita: ufficiale
    attiva: true

  - nome: UPIPA – avvisi delle APSP
    tipo: elenco
    url: https://www.upipa.tn.it/Bacheca/Avvisi
    parole_link: [infermier, libero profession, libero-profession, incaric, sanitari]
    affidabilita: ufficiale
    puo_essere_vuota: true
    attiva: true

  # L'elenco ASUIT mostra 4 bandi per pagina, i più nuovi per primi: si leggono 10 pagine.
  - nome: ASUIT – bandi e concorsi
    tipo: elenco
    url: https://www.asuit.tn.it/bandi-concorsi
    altre_pagine:
      - https://www.asuit.tn.it/bandi-concorsi?page=1
      - https://www.asuit.tn.it/bandi-concorsi?page=2
      - https://www.asuit.tn.it/bandi-concorsi?page=3
      - https://www.asuit.tn.it/bandi-concorsi?page=4
      - https://www.asuit.tn.it/bandi-concorsi?page=5
      - https://www.asuit.tn.it/bandi-concorsi?page=6
      - https://www.asuit.tn.it/bandi-concorsi?page=7
      - https://www.asuit.tn.it/bandi-concorsi?page=8
      - https://www.asuit.tn.it/bandi-concorsi?page=9
    parole_link: [infermier, libero professional, libero-professional, incarichi lp]
    affidabilita: ufficiale
    datore: ASUIT (Trentino)
    attiva: true

  - nome: Villa Sant'Anna Merano – lavora con noi
    tipo: pagina
    url: https://villa-santanna.eu/lavora-con-noi/
    affidabilita: struttura
    datore: Casa di Cura Villa Sant'Anna
    zona: Merano
    attiva: true

  - nome: Gruppo Bonvicini – lavora con noi
    tipo: pagina
    url: https://www.gruppobonvicini.it/lavora-con-noi/
    affidabilita: struttura
    datore: Gruppo Bonvicini
    zona: Bolzano
    attiva: true

  - nome: Schloss Moos – libera professione (suedtirolerjobs)
    tipo: pagina
    url: https://www.suedtirolerjobs.it/jobs/freiberufliche-taetigkeit-in-der-pflege,115073
    affidabilita: aggregatore
    datore: Seniorenwohnheim Schloss Moos
    zona: Vipiteno
    attiva: true

  # --- Aggiunte il 13/11/2026 dopo l'esplorazione dei siti ---
  # Bacheca dell'associazione delle case di riposo dell'Alto Adige (in tedesco).
  - nome: Case di riposo dell'Alto Adige (VdS) – offerte
    tipo: elenco
    url: https://www.vds-suedtirol.it/de/jobs
    altre_pagine:
      - https://www.vds-suedtirol.it/de/jobs?page=1
      - https://www.vds-suedtirol.it/de/jobs?page=2
    parole_link: [krankenpfleg, pflegefach, infermier, freiberuf]
    affidabilita: struttura
    puo_essere_vuota: true
    attiva: true

  - nome: Schloss Moos – Jobs (sito della cooperativa)
    tipo: pagina
    url: https://sozialgenossenschaft-vinzenz.it/schloss-moos/schloss-moos-jobs/
    affidabilita: struttura
    datore: Seniorenwohnheim Schloss Moos
    zona: Vipiteno
    puo_essere_vuota: true
    attiva: true

  - nome: Vinzenzhaus Bolzano – Jobs
    tipo: pagina
    url: https://sozialgenossenschaft-vinzenz.it/vinzenzhaus/vinzenzhaus-jobs/
    affidabilita: struttura
    datore: Seniorenwohnheim Vinzenzhaus
    zona: Bolzano
    puo_essere_vuota: true
    attiva: true

  - nome: Altenheim Kaltern (Caldaro) – Karriere
    tipo: pagina
    url: https://www.ah-kaltern.it/karriere
    affidabilita: struttura
    datore: Fondazione Heinrich von Rottenburg (Altenheim Kaltern)
    zona: Caldaro
    puo_essere_vuota: true
    attiva: true

  # --- Spente: pagine caricate in modo dinamico o rimosse (verifica del 13/11/2026) ---
  - nome: SABES – graduatoria infermieri Bolzano
    tipo: pagina
    url: https://sabes.onboard.org/it/jobs/byekMD4w
    affidabilita: ufficiale
    datore: ASDAA / SABES
    zona: Bolzano
    attiva: false   # scadenze graduatorie: 31/01, 31/05, 30/09

  - nome: Cooperazione trentina – lavora con noi
    tipo: elenco
    url: https://www.cooperazionetrentina.it/lavoraconnoi
    affidabilita: struttura
    attiva: false

# ---- Solo per la messa a punto: pagine di cui elencare i link nel file data/diagnostica.json ----
