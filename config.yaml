    datore: ASDAA / SABES
    zona: Merano
    attiva: false   # 13/11/2026: pagina caricata in modo dinamico, non leggibile. Scadenze graduatorie: 31/01, 31/05, 30/09

  - nome: SABES – graduatoria infermieri Brunico
    tipo: pagina
    url: https://sabes.onboard.org/it/jobs/QgeyM2eJ
    affidabilita: ufficiale
    datore: ASDAA / SABES
    zona: Brunico
    attiva: false   # 13/11/2026: la pagina risponde 404 (annuncio rimosso)

  - nome: Villa Sant'Anna Merano – lavora con noi
    tipo: pagina
    url: https://villa-santanna.eu/lavora-con-noi/
    affidabilita: struttura
    datore: Casa di Cura Villa Sant'Anna
